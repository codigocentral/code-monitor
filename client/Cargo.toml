[package]
name = "monitor-client"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
# Unit-only external provider bindings; normal builds retain native SDKs.
unit-doubles = []

[dependencies]
# Client-specific dependencies
shared = { path = "../shared" }
tokio = { version = "1.0", features = ["full"] }
tonic = { version = "0.14", features = ["tls-ring", "gzip"] }
prost = "0.14"
prost-types = "0.14"
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
config = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.27"
tui = "0.19"
indicatif = "0.18"
rust_decimal = { version = "1.0", features = ["serde-float"] }
base64 = "0.22"
tokio-stream = "0.1"
http = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
tower = "0.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
toml = "0.8"

# Storage
# fallible_uint keeps the u64 columns: values above i64::MAX fail instead of wrapping
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
csv = "1.3"

[dev-dependencies]
log = "=0.4.29"
tempfile = "3.0"

