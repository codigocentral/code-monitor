[package]
name = "monitor-server"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
# Unit-only external provider bindings; normal builds retain native SDKs.
unit-doubles = []

[dependencies]
# Server-specific dependencies
shared = { path = "../shared" }
sysinfo = "0.29"
nix = { version = "0.27", features = ["net"] }
libc = "0.2"
tokio = { version = "1.0", features = ["full"] }
tonic = { version = "0.14", features = ["tls-ring", "gzip"] }
prost = "0.14"
base64 = "0.21"
prost-types = "0.14"
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
clap = { version = "4.0", features = ["derive"] }
config = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tempfile = "3.0"
tokio-stream = "0.1"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# TLS
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Certificate inventory: pure Rust, so the agent does not depend on a system
# OpenSSL being present on the monitored host
x509-parser = "0.16"

# Docker
bollard = "0.16"
# Compose files, for the drift between declared and running containers.
# Already in the tree through `config`, so it adds no crate to the build.
yaml-rust2 = "0.11"
async-trait = "0.1"
futures-util = "0.3"

# HTTP client for registry manifest checks
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Postgres
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }

# MariaDB — rustls rather than the default native-tls, so the build does not
# depend on a system OpenSSL. This matches the rest of the project (rustls
# everywhere) and lets the server link statically against musl for a binary
# that runs on any Linux distribution regardless of its glibc.
mysql_async = { version = "0.37", default-features = false, features = [
    "default-rustls-ring",
] }

[dev-dependencies]
log = "=0.4.29"
